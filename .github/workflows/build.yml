name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pinnacle-sms-organizer-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release with APK
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Pinnacle SMS Organizer (Latest Build)' }}
        body: |
          ### 📱 Pinnacle SMS Organizer APK
          - Download `app-debug.apk` directly on your Android phone.
          - 100% on-device local classification (Personal, Transactions, OTPs, Promotions, Other).
          - Built from commit ${{ github.sha }}.
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
